# Profilo dei test di integrazione: database dedicato squadra_test, mai quello di sviluppo o produzione.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/squadra_test}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:squadra}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}

app:
  security:
    jwt:
      # Valore fittizio usato solo nei test.
      secret: dGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTEyMzQ1Ng==
    cookie-secure: false
  # Mai creare Admin all'avvio dei test, anche se il file .env locale contiene ADMIN_BOOTSTRAP_*.
  bootstrap-admin:
    email: ""
    password: ""
  # Disattivato: tutte le richieste dei test arrivano dallo stesso IP. RateLimitIntegrationTest lo riattiva.
  rate-limit:
    enabled: false
  mail:
    mode: LOG
  openai:
    enabled: false
