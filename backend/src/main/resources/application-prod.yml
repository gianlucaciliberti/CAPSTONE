# Profilo di produzione (Render). Nessun valore di default per i segreti: se mancano, l'avvio fallisce.
spring:
  datasource:
    # DB_URL completo (formato JDBC), oppure le singole parti fornite dal blueprint di Render (render.yaml).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      secret: ${JWT_SECRET}
    cookie-secure: true
  mail:
    # Obbligatoria in produzione: con LOG nessuna email partirebbe, senza alcun errore visibile.
    mode: ${MAIL_MODE}

logging:
  level:
    root: INFO
