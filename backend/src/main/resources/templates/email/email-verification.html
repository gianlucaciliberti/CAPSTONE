<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: page(${subject}, ~{::section})}">
<body>
<section>
    <p>Ciao <span th:text="${firstName}">Mario</span>,</p>
    <p>grazie per esserti registrato al gestionale della squadra.</p>
    <p>Conferma il tuo indirizzo email con il pulsante qui sotto (link valido 24 ore).
        Dopo la conferma, un amministratore approverà il tuo account.</p>
    <table th:replace="~{email/layout :: button(${link}, 'Conferma email')}"></table>
    <p th:replace="~{email/layout :: fallbackLink(${link})}"></p>
    <p style="margin:0;color:#4a5f54;font-size:13px;">Se non ti sei registrato tu, ignora questa email.</p>
</section>
</body>
</html>
