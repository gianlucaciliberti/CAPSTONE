<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: page(${subject}, ~{::section})}">
<body>
<section>
    <p>Ciao <span th:text="${firstName}">Mario</span>,</p>
    <p>sei stato <strong>convocato</strong> per la prossima partita.</p>
    <table th:replace="~{email/layout :: matchDetails}"></table>
    <th:block th:if="${players}">
        <p style="margin:0 0 4px;color:#4a5f54;font-size:13px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;">
            Convocati (<span th:text="${#lists.size(players)}">0</span>)</p>
        <p style="margin:0;" th:text="${#strings.listJoin(players, ', ')}">Nomi</p>
    </th:block>
    <table th:replace="~{email/layout :: button(${callupUrl}, 'Vedi la convocazione')}"></table>
</section>
</body>
</html>
