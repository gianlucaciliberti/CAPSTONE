<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: page(${subject}, ~{::section})}">
<body>
<section>
    <p>Ciao <span th:text="${firstName}">Mario</span>,</p>
    <p>abbiamo ricevuto una richiesta di reimpostazione della password del tuo account.</p>
    <p>Per sceglierne una nuova usa il pulsante qui sotto (link valido <span th:text="${minutes}">30</span>
        minuti, utilizzabile una sola volta).</p>
    <table th:replace="~{email/layout :: button(${link}, 'Scegli una nuova password')}"></table>
    <p th:replace="~{email/layout :: fallbackLink(${link})}"></p>
    <p style="margin:0;color:#4a5f54;font-size:13px;">Se non hai fatto tu la richiesta, ignora questa email: la tua password
        resta invariata.</p>
</section>
</body>
</html>
