# Configurazione comune a tutti i profili.
# I valori sensibili arrivano SOLO da variabili d'ambiente (o dal file .env locale, mai versionato).
spring:
  application:
    name: gestionale
  config:
    # In locale permette di usare un file .env (formato KEY=valore) nella cartella backend/ o nella root del repository.
    # In produzione (Render) il file non esiste e si usano le variabili d'ambiente del servizio.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/squadra_dev}
    username: ${DB_USERNAME:squadra}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        # Limite alla dimensione delle pagine richieste dai client (?size=...)
        max-page-size: 100

server:
  port: ${PORT:8080}
  # Render termina TLS sul proxy e inoltra X-Forwarded-*. Non si usa il filtro standard di Spring, che prende il
  # primo valore di X-Forwarded-For (falsificabile dal client): IP e https li ricava ClientIpFilter.
  forward-headers-strategy: none
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  paths-to-match: /api/v1/**

app:
  timezone: Europe/Rome
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:gestionale-squadra}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
    cookie-secure: ${COOKIE_SECURE:true}
  mail:
    # LOG = nessun invio reale (le email vengono scritte nei log); MAILJET = invio tramite API Mailjet.
    mode: ${MAIL_MODE:LOG}
    from-email: ${MAIL_FROM_EMAIL:noreply@example.com}
    from-name: ${MAIL_FROM_NAME:Gestionale Squadra}
    max-attempts: ${MAIL_MAX_ATTEMPTS:5}
    # Worker che invia le email in coda ogni worker-interval.
    worker-enabled: ${MAIL_WORKER_ENABLED:true}
    worker-interval: ${MAIL_WORKER_INTERVAL:PT10S}
    mailjet:
      api-key: ${MAILJET_API_KEY:}
      api-secret: ${MAILJET_API_SECRET:}
      webhook-secret: ${MAILJET_WEBHOOK_SECRET:}
  # Primo Admin: impostare le variabili solo per il primo avvio, poi rimuoverle (vedi README).
  bootstrap-admin:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    first-name: ${ADMIN_BOOTSTRAP_FIRST_NAME:}
    last-name: ${ADMIN_BOOTSTRAP_LAST_NAME:}
  # Account Admin per chi deve valutare il progetto: creato all'avvio se l'email non esiste ancora (vedi README).
  reviewer:
    email: ${REVIEWER_EMAIL:}
    password: ${REVIEWER_PASSWORD:}
    first-name: ${REVIEWER_FIRST_NAME:}
    last-name: ${REVIEWER_LAST_NAME:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Richieste POST ammesse per IP in ogni finestra temporale.
    rules:
      - path: /api/v1/auth/login
        capacity: 10
        window: PT1M
      - path: /api/v1/auth/register
        capacity: 5
        window: PT1H
      - path: /api/v1/auth/refresh
        capacity: 30
        window: PT1M
      - path: /api/v1/auth/forgot-password
        capacity: 5
        window: PT1H
      - path: /api/v1/auth/reset-password
        capacity: 10
        window: PT15M
      - path: /api/v1/auth/verify-email
        capacity: 20
        window: PT15M
      - path: /api/v1/auth/resend-verification
        capacity: 5
        window: PT1H
      - path: /api/v1/auth/change-password
        capacity: 10
        window: PT15M
      - path: /api/v1/webhooks/mailjet
        capacity: 300
        window: PT1M
  openai:
    enabled: ${OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    # Nessun modello predefinito: va scelto esplicitamente quando l'integrazione viene attivata.
    model: ${OPENAI_MODEL:}
    timeout: ${OPENAI_TIMEOUT:PT20S}
