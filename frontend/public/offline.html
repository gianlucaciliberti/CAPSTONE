<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e4f" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Pagina mostrata dal service worker quando non c'è rete e l'app non è ancora in cache.
         Nessuno script né stile inline: compatibile con la Content Security Policy del sito. -->
    <link rel="stylesheet" href="/offline.css" />
    <title>Sei offline · Gestionale Squadra</title>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Sei offline</h1>
      <p>Non riesco a raggiungere il server della squadra. Controlla la connessione e riprova.</p>
      <a class="button" href="/">Riprova</a>
    </main>
  </body>
</html>
