<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e4f" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <title>Sei offline · Gestionale Squadra</title>
    <!-- Pagina mostrata dal service worker quando non c'è rete e l'app non è ancora in cache. Nessuna dipendenza esterna. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f4f7f5;
        color: #1f2933;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
      p { line-height: 1.5; color: #4b5563; }
      a.button {
        display: inline-block;
        text-decoration: none;
        min-height: 44px;
        box-sizing: border-box;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0b6e4f;
        color: #fff;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Sei offline</h1>
      <p>Non riesco a raggiungere il server della squadra. Controlla la connessione e riprova.</p>
      <!-- Un link invece di uno script inline: compatibile con una Content Security Policy restrittiva. -->
      <a class="button" href="/">Riprova</a>
    </main>
  </body>
</html>
